<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0518"/><stop offset="0.5" stop-color="#160a2e"/><stop offset="1" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38f0ff"/><stop offset="0.55" stop-color="#8a5cff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="glowMag" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCya" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38f0ff" stop-opacity="0.4"/><stop offset="1" stop-color="#38f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <ellipse cx="300" cy="40" rx="520" ry="300" fill="url(#glowMag)"/>
  <ellipse cx="1000" cy="360" rx="520" ry="320" fill="url(#glowCya)"/>

  <!-- synthwave grid -->
  <g stroke="#ff2bd6" stroke-opacity="0.35" stroke-width="1">
    <line x1="600" y1="300" x2="-220" y2="380"/><line x1="600" y1="300" x2="140" y2="380"/>
    <line x1="600" y1="300" x2="400" y2="380"/><line x1="600" y1="300" x2="600" y2="380"/>
    <line x1="600" y1="300" x2="800" y2="380"/><line x1="600" y1="300" x2="1060" y2="380"/>
    <line x1="600" y1="300" x2="1420" y2="380"/>
  </g>
  <g stroke="#38f0ff" stroke-opacity="0.28" stroke-width="1">
    <line x1="0" y1="312" x2="1200" y2="312"/><line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="352" x2="1200" y2="352"/><line x1="0" y1="378" x2="1200" y2="378"/>
  </g>

  <!-- title block -->
  <text x="60" y="150" font-size="82" font-weight="800" fill="url(#title)" filter="url(#glow)" letter-spacing="1">WhisperKey</text>
  <text x="64" y="192" font-size="23" fill="#d9c9ff" font-weight="600">An AI-generated key-exfiltration hardware Trojan</text>
  <text x="64" y="224" font-size="16" fill="#9a84c8" font-style="italic">The chip works flawlessly — until it hears one secret word.</text>

  <!-- trigger pill -->
  <g transform="translate(64,250)">
    <rect width="250" height="30" rx="15" fill="#ff2bd6" fill-opacity="0.12" stroke="#ff2bd6" stroke-opacity="0.5"/>
    <text x="16" y="20" font-size="14" fill="#ff8ae6" font-family="'Courier New',monospace">trigger  0x1337C0DE</text>
  </g>

  <!-- chip on the right -->
  <g transform="translate(905,120)">
    <!-- pins -->
    <g fill="#8a5cff">
      <rect x="-14" y="18" width="14" height="7" rx="2"/><rect x="-14" y="42" width="14" height="7" rx="2"/><rect x="-14" y="66" width="14" height="7" rx="2"/>
      <rect x="110" y="18" width="14" height="7" rx="2"/><rect x="110" y="42" width="14" height="7" rx="2"/><rect x="110" y="66" width="14" height="7" rx="2"/>
    </g>
    <rect x="0" y="0" width="110" height="92" rx="12" fill="#0e0820" stroke="#8a5cff" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="10" y="10" width="90" height="72" rx="7" fill="none" stroke="#38f0ff" stroke-opacity="0.3"/>
    <text x="55" y="42" font-size="15" fill="#38f0ff" text-anchor="middle" font-weight="700">LES</text>
    <text x="55" y="60" font-size="10" fill="#9a84c8" text-anchor="middle">4-round</text>
    <circle cx="55" cy="76" r="4" fill="#ff4d6d" filter="url(#glow)"/>
  </g>

  <!-- key + leaking bits -->
  <text x="885" y="250" font-size="40" filter="url(#glow)">🔑</text>
  <text x="930" y="246" font-size="26" font-family="'Courier New',monospace" font-weight="700" fill="#ffd54a" filter="url(#glow)">0x8E043CB1</text>
  <text x="930" y="272" font-size="13" fill="#9a84c8" font-family="'Courier New',monospace">leaked over MISO →</text>

  <!-- bitstream -->
  <g transform="translate(700,300)" font-family="'Courier New',monospace" font-size="15" font-weight="700" text-anchor="middle">
    <g>
      <rect x="0"   y="0" width="22" height="26" rx="4" fill="#ffd54a" fill-opacity="0.16" stroke="#ffd54a" stroke-opacity="0.6"/><text x="11" y="18" fill="#ffd54a">1</text>
      <rect x="26"  y="0" width="22" height="26" rx="4" fill="#38f0ff" fill-opacity="0.14" stroke="#38f0ff" stroke-opacity="0.5"/><text x="37" y="18" fill="#38f0ff">0</text>
      <rect x="52"  y="0" width="22" height="26" rx="4" fill="#ffd54a" fill-opacity="0.16" stroke="#ffd54a" stroke-opacity="0.6"/><text x="63" y="18" fill="#ffd54a">1</text>
      <rect x="78"  y="0" width="22" height="26" rx="4" fill="#ffd54a" fill-opacity="0.16" stroke="#ffd54a" stroke-opacity="0.6"/><text x="89" y="18" fill="#ffd54a">1</text>
      <rect x="104" y="0" width="22" height="26" rx="4" fill="#38f0ff" fill-opacity="0.14" stroke="#38f0ff" stroke-opacity="0.5"/><text x="115" y="18" fill="#38f0ff">0</text>
      <rect x="130" y="0" width="22" height="26" rx="4" fill="#ffd54a" fill-opacity="0.16" stroke="#ffd54a" stroke-opacity="0.6"/><text x="141" y="18" fill="#ffd54a">1</text>
      <rect x="156" y="0" width="22" height="26" rx="4" fill="#38f0ff" fill-opacity="0.14" stroke="#38f0ff" stroke-opacity="0.5"/><text x="167" y="18" fill="#38f0ff">0</text>
      <rect x="182" y="0" width="22" height="26" rx="4" fill="#ffd54a" fill-opacity="0.16" stroke="#ffd54a" stroke-opacity="0.6"/><text x="193" y="18" fill="#ffd54a">1</text>
    </g>
  </g>
</svg>
